[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "21cmeval"
version = "0.1.0"
description = "End-to-end evaluation suite for 21cm field emulators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
hdf5 = ["h5py>=3.8"]
viz = ["matplotlib>=3.6"]
dev = ["pytest>=7"]
all = ["torch>=2.0", "h5py>=3.8", "matplotlib>=3.6", "pytest>=7"]

[project.scripts]
eval21 = "eval21.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
